<!doctype html>
<!--
  Social preview card (og:image / twitter:image), 1200x630.
  Regenerate public/og-card.jpg with:  npm run og:image
  (renders this page with headless Chrome, see og/render.mjs)
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OG card</title>
<style>
  :root {
    --primary: #a18a66;
    --accent: #f59e0b;
    --bg: #1f2937;
    --bg2: #111827;
    --surface: #374151;
    --text: #ffffff;
    --text2: #d1d5db;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    color: var(--text);
    background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 35%, #1b2331 60%, var(--surface) 100%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(161, 138, 102, 0.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(161, 138, 102, 0.10) 1px, transparent 1px);
    background-size: 50px 50px;
    opacity: 0.45;
    -webkit-mask-image: linear-gradient(90deg, rgba(0,0,0,0.25), #000 70%);
  }
  .glow {
    position: absolute; left: 905px; top: 315px; width: 620px; height: 620px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(161, 138, 102, 0.32) 0%, transparent 65%);
    border-radius: 50%;
  }
  .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 10px;
    background: linear-gradient(180deg, var(--primary), var(--accent)); }
  .content {
    position: absolute; left: 84px; top: 0; bottom: 0; width: 620px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .label {
    font-size: 22px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase;
    background: linear-gradient(45deg, var(--primary), var(--accent));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 22px;
  }
  h1 {
    font-size: 66px; font-weight: 900; line-height: 1.05; letter-spacing: -1.5px;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
  }
  .title {
    margin-top: 22px; font-size: 34px; font-weight: 400; color: var(--primary);
  }
  .rule { margin: 30px 0 26px; width: 96px; height: 4px; border-radius: 2px;
    background: linear-gradient(90deg, var(--primary), var(--accent)); }
  .tagline { font-size: 24px; line-height: 1.45; color: var(--text2); max-width: 600px; }
  .url {
    position: absolute; left: 84px; bottom: 44px;
    font-size: 24px; font-weight: 600; letter-spacing: 0.5px; color: var(--text);
  }
  .url span { color: var(--primary); }
  .photo {
    position: absolute; left: 905px; top: 315px; width: 380px; height: 380px;
    transform: translate(-50%, -50%);
    border-radius: 50%; object-fit: cover;
    border: 6px solid var(--primary);
    box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
  }
  .ring {
    position: absolute; left: 905px; top: 315px; width: 432px; height: 432px;
    transform: translate(-50%, -50%);
    border-radius: 50%; border: 1px solid rgba(161, 138, 102, 0.45);
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="bar"></div>
  <div class="content">
    <div class="label">Portfolio &amp; CV</div>
    <h1>Jesús Márquez<br />Delgado</h1>
    <div class="title">Web Developer · Drupal, PHP &amp; React</div>
    <div class="rule"></div>
    <p class="tagline">Enterprise Drupal &amp; React websites ·<br />Full-stack and mobile side projects</p>
  </div>
  <div class="url"><span>↗</span> jzmarquez.com</div>
  <div class="ring"></div>
  <img class="photo" src="../src/files/images/fotocvfondo-lg.webp" alt="" />
</body>
</html>
